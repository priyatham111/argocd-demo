
apiVersion: batch/v1
kind: Job
metadata:
  name: nginx-sync-failure
  namespace: default
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: diagnostic
          image: busybox:1.36
          command:
            - sh
            - -c
            - "echo 'Argo CD sync failed; investigate deployment'"