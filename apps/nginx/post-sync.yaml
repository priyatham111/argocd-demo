apiVersion: batch/v1
kind: Job
metadata:
  name: nginx-post-sync-test
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Argo CD PostSync hook works!'"]